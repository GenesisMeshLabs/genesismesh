name: Release train audit

# The cross-component ceiling, audited nightly and never on pull requests
# (1.11.0 plan, section 5.3): no component's newest release may be of a newer
# major.minor than the core's latest release. Pull requests and the publish
# workflows check only the core's own tags, so a component release can never
# turn the core's CI red. A failed scheduled run opens an issue, or comments on
# the open one.

on:
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ceiling:
    name: No component released above the core
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Audit the ceiling
        env:
          RELEASE_TRAIN_TOKEN: ${{ secrets.RELEASE_TRAIN_TOKEN }}
        # Without pipefail the step would report tee's exit code and never fail.
        run: |
          set -o pipefail
          python scripts/check_release_train.py --audit-ceiling 2>&1 | tee audit.txt

      - name: Open or update the issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Release train audit failed"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The nightly ceiling audit failed: a component released above the core's"
            echo "latest major.minor, or the tags could not be read. Run: $RUN_URL"
            echo
            echo '```'
            cat audit.txt 2>/dev/null || echo "(no output)"
            echo '```'
          } > body.md
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" \
            --json number,title --jq "map(select(.title == env.TITLE)) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file body.md
          fi
