name: Published artifacts

# Runs the cross-language scenario from the released packages, as a consumer
# installs them: genesis-mesh from PyPI, genesis-mesh-sdk from npm,
# genesismesh-sdk-dotnet from NuGet and sdk-go from the Go module proxy.
# The images job pulls the released container images anonymously, verifies
# their signatures and runs the container smoke tests against them (v1.1).
# The verifier and edge jobs download the Rust release binaries and verify
# their signatures; the edge job (1.7.0 on) also checks the edge image holds
# the released binary and runs the released agent against the released NA.
# Run it after the release train for a version has published (core first,
# then the SDKs); it also runs daily against the version in VERSION.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to test (default: VERSION on main)"
        required: false
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  published:
    name: Released packages agree
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Choose the version
        env:
          REQUESTED: ${{ inputs.version }}
        run: echo "VERSION_UNDER_TEST=${REQUESTED:-$(tr -d '[:space:]' < VERSION)}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Run the scenario from the released packages
        env:
          PYTHON: python
        run: interop/run_all.sh --published "$VERSION_UNDER_TEST"

  images:
    name: Released container images verify and run (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-latest}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    env:
      NA_IMAGE: ghcr.io/genesismeshlabs/genesis-mesh
      GW_IMAGE: ghcr.io/genesismeshlabs/genesis-mesh-gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Choose the version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          V="${REQUESTED:-$(tr -d '[:space:]' < VERSION)}"
          echo "VERSION_UNDER_TEST=$V" >> "$GITHUB_ENV"
          # Images are published from 1.1.0 on; earlier releases have none.
          if [ "$(printf '%s\n%s\n' 1.1.0 "$V" | sort -V | head -n 1)" = "1.1.0" ]; then
            echo "HAS_IMAGES=true" >> "$GITHUB_ENV"
          else
            echo "::notice::$V predates the published container images (1.1.0); nothing to check."
            echo "HAS_IMAGES=false" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: env.HAS_IMAGES == 'true'
        with:
          python-version: "3.14"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.HAS_IMAGES == 'true'

      - name: Pull anonymously and verify the signatures
        if: env.HAS_IMAGES == 'true'
        run: |
          docker logout ghcr.io || true
          V="$VERSION_UNDER_TEST"
          docker pull "$NA_IMAGE:$V"
          docker pull "$GW_IMAGE:$V"
          cosign verify "$NA_IMAGE:$V" \
            --certificate-identity "https://github.com/GenesisMeshLabs/genesismesh/.github/workflows/publish-image.yml@refs/tags/v$V" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          cosign verify "$GW_IMAGE:$V" \
            --certificate-identity "https://github.com/GenesisMeshLabs/gateway/.github/workflows/distribution.yml@refs/tags/v$V" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "Both images verified for $V"

      - name: Floating tags point at the released digest
        if: env.HAS_IMAGES == 'true'
        run: |
          V="$VERSION_UNDER_TEST"
          tags="$(python scripts/image_tags.py "$V" --tags-from-git)"
          if ! printf '%s\n' "$tags" | grep -qx "$V"; then echo "::error::no tags computed for $V: '$tags'"; exit 1; fi
          for image in "$NA_IMAGE" "$GW_IMAGE"; do
            digest="$(docker buildx imagetools inspect "$image:$V" --format '{{json .Manifest.Digest}}')"
            for tag in $tags; do
              got="$(docker buildx imagetools inspect "$image:$tag" --format '{{json .Manifest.Digest}}')"
              if [ "$got" != "$digest" ]; then echo "::error::$image:$tag is $got, expected $digest"; exit 1; fi
            done
          done

      - name: Container smoke tests against the released images
        if: env.HAS_IMAGES == 'true'
        run: |
          python scripts/container_smoke.py --image "$NA_IMAGE:$VERSION_UNDER_TEST" \
            --gateway-image "$GW_IMAGE:$VERSION_UNDER_TEST" --version "$VERSION_UNDER_TEST" \
            --compose-file deploy/compose/docker-compose.images.yml

  verifier:
    name: Released verifier verifies offline (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: x86_64-unknown-linux-musl, runner: ubuntu-latest}
          - {target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Choose the version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          V="${REQUESTED:-$(tr -d '[:space:]' < VERSION)}"
          echo "VERSION_UNDER_TEST=$V" >> "$GITHUB_ENV"
          # genesis-mesh-verify is released with the Rust SDK from 1.5.0 on.
          if [ "$(printf '%s\n%s\n' 1.5.0 "$V" | sort -V | head -n 1)" = "1.5.0" ]; then
            echo "HAS_VERIFIER=true" >> "$GITHUB_ENV"
          else
            echo "::notice::$V predates the independent verifier (1.5.0); nothing to check."
            echo "HAS_VERIFIER=false" >> "$GITHUB_ENV"
          fi

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.HAS_VERIFIER == 'true'

      - name: Download anonymously and verify the signatures
        if: env.HAS_VERIFIER == 'true'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          V="$VERSION_UNDER_TEST"
          base="https://github.com/GenesisMeshLabs/sdk-rust/releases/download/v$V"
          bin="genesis-mesh-verify-$V-$TARGET"
          mkdir -p verifier && cd verifier
          for f in "$bin" "$bin.sigstore.json" SHA256SUMS SHA256SUMS.sigstore.json; do
            curl -fsSL --retry 5 -o "$f" "$base/$f"
          done
          identity="https://github.com/GenesisMeshLabs/sdk-rust/.github/workflows/verifier.yml@refs/tags/v$V"
          for f in SHA256SUMS "$bin"; do
            cosign verify-blob --bundle "$f.sigstore.json" --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
          done
          grep " $bin\$" SHA256SUMS | sha256sum --check -
          chmod +x "$bin"
          echo "VERIFIER=$PWD/$bin" >> "$GITHUB_ENV"

      - name: The binary is static
        if: env.HAS_VERIFIER == 'true'
        run: |
          if readelf -d "$VERIFIER" | grep -q NEEDED; then
            echo "::error::genesis-mesh-verify has dynamic dependencies"; exit 1
          fi
          "$VERIFIER" --version

      - name: The frozen 1.5.0 audit pack verifies with the network off
        if: env.HAS_VERIFIER == 'true'
        run: |
          f=conformance/fixtures/audit-pack-1.5.0
          sudo unshare --net -- "$VERIFIER" --json pack "$f/pack" --anchor "$f/root.pub" \
            --known-anchors "$f/anchors.json" --require-anchors > result.json
          python3 -c 'import json,sys; r=json.load(open("result.json")); print(json.dumps({k: r.get(k) for k in ("verified", "failures")})); sys.exit(0 if r.get("verified") else 1)'

  edge:
    name: Released edge agent verifies and runs (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: x86_64-unknown-linux-musl, runner: ubuntu-latest, arch: amd64}
          - {target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, arch: arm64}
    runs-on: ${{ matrix.runner }}
    env:
      NA_IMAGE: ghcr.io/genesismeshlabs/genesis-mesh
      EDGE_IMAGE: ghcr.io/genesismeshlabs/genesis-mesh-edge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Choose the version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          V="${REQUESTED:-$(tr -d '[:space:]' < VERSION)}"
          echo "VERSION_UNDER_TEST=$V" >> "$GITHUB_ENV"
          # genesis-mesh-edge is released with the Rust SDK from 1.7.0 on.
          if [ "$(printf '%s\n%s\n' 1.7.0 "$V" | sort -V | head -n 1)" = "1.7.0" ]; then
            echo "HAS_EDGE=true" >> "$GITHUB_ENV"
          else
            echo "::notice::$V predates the edge agent (1.7.0); nothing to check."
            echo "HAS_EDGE=false" >> "$GITHUB_ENV"
          fi

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.HAS_EDGE == 'true'

      - name: Download anonymously and verify the signatures
        if: env.HAS_EDGE == 'true'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          V="$VERSION_UNDER_TEST"
          base="https://github.com/GenesisMeshLabs/sdk-rust/releases/download/v$V"
          bin="genesis-mesh-edge-$V-$TARGET"
          mkdir -p edge && cd edge
          for f in "$bin" "$bin.sigstore.json" SHA256SUMS-edge SHA256SUMS-edge.sigstore.json; do
            curl -fsSL --retry 5 -o "$f" "$base/$f"
          done
          identity="https://github.com/GenesisMeshLabs/sdk-rust/.github/workflows/edge.yml@refs/tags/v$V"
          for f in SHA256SUMS-edge "$bin"; do
            cosign verify-blob --bundle "$f.sigstore.json" --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
          done
          grep " $bin\$" SHA256SUMS-edge | sha256sum --check -
          chmod +x "$bin"
          echo "EDGE_BIN=$PWD/$bin" >> "$GITHUB_ENV"
          echo "EDGE_SHA256=$(grep " $bin\$" SHA256SUMS-edge | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: The binary is static and reports the release
        if: env.HAS_EDGE == 'true'
        run: |
          if readelf -d "$EDGE_BIN" | grep -q NEEDED; then
            echo "::error::genesis-mesh-edge has dynamic dependencies"; exit 1
          fi
          version="$("$EDGE_BIN" --version)"
          echo "$version"
          case "$version" in
            *"$VERSION_UNDER_TEST"*) ;;
            *) echo "::error::--version printed '$version', expected $VERSION_UNDER_TEST"; exit 1 ;;
          esac

      - name: Pull the image anonymously and verify its signature
        if: env.HAS_EDGE == 'true'
        run: |
          docker logout ghcr.io || true
          V="$VERSION_UNDER_TEST"
          docker pull --platform "linux/${{ matrix.arch }}" "$EDGE_IMAGE:$V"
          cosign verify "$EDGE_IMAGE:$V" \
            --certificate-identity "https://github.com/GenesisMeshLabs/sdk-rust/.github/workflows/edge.yml@refs/tags/v$V" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "Edge image verified for $V"

      - name: The image holds the released binary
        if: env.HAS_EDGE == 'true'
        run: |
          id="$(docker create --platform "linux/${{ matrix.arch }}" "$EDGE_IMAGE:$VERSION_UNDER_TEST")"
          docker cp "$id:/genesis-mesh-edge" ./edge-from-image
          docker rm "$id" > /dev/null
          got="$(sha256sum ./edge-from-image | cut -d' ' -f1)"
          if [ "$got" != "$EDGE_SHA256" ]; then
            echo "::error::the image's binary is $got, the released one $EDGE_SHA256"; exit 1
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: env.HAS_EDGE == 'true' && matrix.arch == 'amd64'
        with:
          python-version: "3.14"

      - name: The released agent enrols, decides and is revoked at the released NA
        if: env.HAS_EDGE == 'true' && matrix.arch == 'amd64'
        run: |
          V="$VERSION_UNDER_TEST"
          docker pull "$NA_IMAGE:$V"
          python scripts/container_smoke.py --image "$NA_IMAGE:$V" --edge-image "$EDGE_IMAGE:$V" \
            --version "$V" --only edge
