name: Interoperability

# Cross-language interoperability proof (v0.61): a live Network Authority and
# the Python, Go, TypeScript and C# implementations run one scenario, and the
# job fails if any two of them disagree on any protocol decision.

# No workflow_dispatch: a manual run on the default branch would check out SDK
# code by a ref derived from the run (CodeQL: cache poisoning). Pushes to main
# and pull requests cover every change.
on:
  push:
    branches:
      - main
  pull_request:
  # The merge queue re-tests a pull request on top of main before it merges.
  merge_group:

permissions:
  contents: read

jobs:
  # Skipped when a pull request touches nothing the scenario runs (the package,
  # its build inputs, the vectors, interop/). The required check is the
  # summary job at the end, which a cancelled or failed run never passes.
  changes:
    uses: ./.github/workflows/changes.yml
    with:
      group: interop

  interop:
    name: Interoperability run (Python, Go, TypeScript and C#)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The SDKs run at the releases (or main commits) pinned in
      # contract/consumer-pins.json, never at a branch picked by name: a change
      # is tested against the same SDK code in its pull request, in the merge
      # queue and on main. A core change that needs newer SDK behaviour pins
      # the SDK's main commit in the same pull request (scripts/consumer_pins.py).
      - name: Read the pinned SDK revisions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/consumer_pins.py env --verify | tee -a "$GITHUB_ENV"

      - name: Check out the Go SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GenesisMeshLabs/sdk-go
          ref: ${{ env.SDK_GO_REF }}
          path: sdks/sdk-go

      - name: Check out the TypeScript SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GenesisMeshLabs/sdk-typescript
          ref: ${{ env.SDK_TS_REF }}
          path: sdks/sdk-typescript

      - name: Check out the .NET SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GenesisMeshLabs/sdk-dotnet
          ref: ${{ env.SDK_DOTNET_REF }}
          path: sdks/sdk-dotnet

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      # The core checks the vectors themselves. From 1.11.0 each SDK checks its
      # own copies against the contract bundle it pins (its "Contract bundle"
      # job); a pinned SDK release may lag the vectors on main by design.
      - name: Conformance vectors pass
        run: python conformance/runner.py

      - name: Run the four legs
        env:
          GM_SDK_GO_DIR: ${{ github.workspace }}/sdks/sdk-go
          GM_SDK_TS_DIR: ${{ github.workspace }}/sdks/sdk-typescript
          GM_SDK_DOTNET_DIR: ${{ github.workspace }}/sdks/sdk-dotnet
          PYTHON: python
        run: interop/run_all.sh

      - name: Keep the scenario's artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interop-fixtures
          # na.json carries the throwaway operator key; never publish it.
          path: |
            interop/fixtures/
            !interop/fixtures/na.json
          if-no-files-found: ignore

  # The required check "Python, Go, TypeScript and C# agree": passes when the interoperability run passed, or when the
  # change detection said there was nothing to test and the interoperability run was skipped.
  # A failed or cancelled run fails it. With no detection output the job runs and must succeed.
  interop-result:
    name: Python, Go, TypeScript and C# agree
    needs: [changes, interop]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Passed, or nothing to test
        env:
          RESULT: ${{ needs.interop.result }}
          RUN: ${{ needs.changes.outputs.run }}
        run: |
          echo "Python, Go, TypeScript and C# agree: $RESULT (relevant changes: ${RUN:-unknown})"
          if [ "$RUN" = false ] && [ "$RESULT" = skipped ]; then exit 0; fi
          test "$RESULT" = success
