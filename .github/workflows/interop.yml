name: Interoperability

# Cross-language interoperability proof (v0.61): a live Network Authority and
# the Python, Go, TypeScript and C# implementations run one scenario, and the
# job fails if any two of them disagree on any protocol decision.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interop:
    name: Python, Go, TypeScript and C# agree
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A change can span the core and the SDKs (one release train), so a core
      # branch is tested against the SDK branches of the same name when they all
      # exist, and against main otherwise. Only these refs are run: a run on the
      # default branch never executes code from a ref someone chose.
      - name: Choose the SDK revision
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          ref=main
          for sdk in sdk-go sdk-typescript sdk-dotnet sdk-rust; do
            if git ls-remote --exit-code --heads "https://github.com/GenesisMeshLabs/$sdk.git" "refs/heads/$BRANCH" >/dev/null; then
              ref="$BRANCH"
            else
              ref=main
              break
            fi
          done
          echo "Testing against SDK revision: $ref"
          echo "SDK_REF=$ref" >> "$GITHUB_ENV"

      - name: Check out the Go SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GenesisMeshLabs/sdk-go
          ref: ${{ env.SDK_REF }}
          path: sdks/sdk-go

      - name: Check out the TypeScript SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GenesisMeshLabs/sdk-typescript
          ref: ${{ env.SDK_REF }}
          path: sdks/sdk-typescript

      - name: Check out the .NET SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GenesisMeshLabs/sdk-dotnet
          ref: ${{ env.SDK_REF }}
          path: sdks/sdk-dotnet

      - name: Check out the Rust SDK (vector copies only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GenesisMeshLabs/sdk-rust
          ref: ${{ env.SDK_REF }}
          path: sdks/sdk-rust

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Conformance vectors are current
        run: |
          python conformance/runner.py
          for sdk in sdk-go/genesismesh/testdata sdk-typescript/tests/fixtures sdk-dotnet/tests/GenesisMesh.Sdk.Tests/testdata; do
            for suite in interop consensus admin_auth field_registry; do
              cmp "conformance/vectors/$suite.json" "sdks/$sdk/conformance/$suite.json"
            done
          done
          for suite in admin_auth field_registry; do
            cmp "conformance/vectors/$suite.json" "sdks/sdk-rust/tests/fixtures/$suite.json"
          done

      - name: Go verifier conformance
        working-directory: sdks/sdk-go
        run: go test ./... -run 'Conformance|Canonical'

      - name: Run the four legs
        env:
          GM_SDK_GO_DIR: ${{ github.workspace }}/sdks/sdk-go
          GM_SDK_TS_DIR: ${{ github.workspace }}/sdks/sdk-typescript
          GM_SDK_DOTNET_DIR: ${{ github.workspace }}/sdks/sdk-dotnet
          PYTHON: python
        run: interop/run_all.sh

      - name: Keep the scenario's artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: interop-fixtures
          # na.json carries the throwaway operator key; never publish it.
          path: |
            interop/fixtures/
            !interop/fixtures/na.json
          if-no-files-found: ignore
