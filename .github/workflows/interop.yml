name: Interoperability

# Cross-language interoperability proof (v0.61): a live Network Authority and
# the Python, Go, TypeScript and C# implementations run one scenario, and the
# job fails if any two of them disagree on any protocol decision.

# No workflow_dispatch: a manual run on the default branch would check out SDK
# code by a ref derived from the run (CodeQL: cache poisoning). Pushes to main
# and pull requests cover every change.
on:
  push:
    branches:
      - main
  pull_request:
  # The merge queue re-tests a pull request on top of main before it merges.
  merge_group:

permissions:
  contents: read

jobs:
  # Skipped when a pull request touches nothing the scenario runs (the package,
  # its build inputs, the vectors, interop/). The required check is the
  # summary job at the end, which a cancelled or failed run never passes.
  changes:
    uses: ./.github/workflows/changes.yml
    with:
      group: interop

  interop:
    name: Interoperability run (Python, Go, TypeScript and C#)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A change can span the core and the SDKs (one release train), so a core
      # branch is tested against the SDK branches of the same name when they all
      # exist, and against main otherwise. Only these refs are run: a run on the
      # default branch never executes code from a ref someone chose. In the merge
      # queue the ref is gh-readonly-queue/..., so main is used: merge the SDK
      # side of a coordinated change before queueing the core side.
      - name: Choose the SDK revision
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          ref=main
          for sdk in sdk-go sdk-typescript sdk-dotnet sdk-rust; do
            if git ls-remote --exit-code --heads "https://github.com/GenesisMeshLabs/$sdk.git" "refs/heads/$BRANCH" >/dev/null; then
              ref="$BRANCH"
            else
              ref=main
              break
            fi
          done
          echo "Testing against SDK revision: $ref"
          echo "SDK_REF=$ref" >> "$GITHUB_ENV"

      - name: Check out the Go SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GenesisMeshLabs/sdk-go
          ref: ${{ env.SDK_REF }}
          path: sdks/sdk-go

      - name: Check out the TypeScript SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GenesisMeshLabs/sdk-typescript
          ref: ${{ env.SDK_REF }}
          path: sdks/sdk-typescript

      - name: Check out the .NET SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GenesisMeshLabs/sdk-dotnet
          ref: ${{ env.SDK_REF }}
          path: sdks/sdk-dotnet

      - name: Check out the Rust SDK (vector copies only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GenesisMeshLabs/sdk-rust
          ref: ${{ env.SDK_REF }}
          path: sdks/sdk-rust

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Conformance vectors are current
        run: |
          python conformance/runner.py
          for sdk in sdk-go/genesismesh/testdata sdk-typescript/tests/fixtures sdk-dotnet/tests/GenesisMesh.Sdk.Tests/testdata; do
            for suite in interop consensus admin_auth field_registry canonical; do
              cmp "conformance/vectors/$suite.json" "sdks/$sdk/conformance/$suite.json"
            done
          done
          for suite in admin_auth field_registry canonical; do
            cmp "conformance/vectors/$suite.json" "sdks/sdk-rust/tests/fixtures/$suite.json"
          done
          # v1.3.0: the SDKs that verify exports run the out_of_band suite.
          cmp conformance/vectors/out_of_band.json sdks/sdk-typescript/tests/fixtures/conformance/out_of_band.json
          cmp conformance/vectors/out_of_band.json sdks/sdk-rust/tests/fixtures/out_of_band.json
          # v1.4.0: and the remediation suite (remediation and review records).
          cmp conformance/vectors/remediation.json sdks/sdk-typescript/tests/fixtures/conformance/remediation.json
          cmp conformance/vectors/remediation.json sdks/sdk-rust/tests/fixtures/remediation.json
          # v1.5.0: and the audit suite (key history, packs, completeness).
          cmp conformance/vectors/audit.json sdks/sdk-typescript/tests/fixtures/conformance/audit.json
          cmp conformance/vectors/audit.json sdks/sdk-rust/tests/fixtures/audit.json
          cmp conformance/vectors/audit.json sdks/sdk-go/genesismesh/testdata/conformance/audit.json
          cmp conformance/vectors/audit.json sdks/sdk-dotnet/tests/GenesisMesh.Sdk.Tests/testdata/conformance/audit.json
          # v1.6.0: and the grants suite (grants, time tokens, grant uses, revocations).
          cmp conformance/vectors/grants.json sdks/sdk-typescript/tests/fixtures/conformance/grants.json
          cmp conformance/vectors/grants.json sdks/sdk-rust/tests/fixtures/grants.json
          cmp conformance/vectors/grants.json sdks/sdk-go/genesismesh/testdata/conformance/grants.json
          cmp conformance/vectors/grants.json sdks/sdk-dotnet/tests/GenesisMesh.Sdk.Tests/testdata/conformance/grants.json
          # v1.7.0: and the node suite (node request signatures), which only the Rust SDK runs.
          cmp conformance/vectors/node.json sdks/sdk-rust/tests/fixtures/node.json
          # 1.8.1: and the vouching suite (the vouching horizon of NA-signed records).
          cmp conformance/vectors/vouching.json sdks/sdk-typescript/tests/fixtures/conformance/vouching.json
          cmp conformance/vectors/vouching.json sdks/sdk-rust/tests/fixtures/vouching.json
          cmp conformance/vectors/vouching.json sdks/sdk-go/genesismesh/testdata/conformance/vouching.json
          cmp conformance/vectors/vouching.json sdks/sdk-dotnet/tests/GenesisMesh.Sdk.Tests/testdata/conformance/vouching.json

      # A filter that matches no test passes in Go ("no tests to run"): require
      # at least one, so a renamed test cannot turn this step green.
      - name: Go verifier conformance
        working-directory: sdks/sdk-go
        run: |
          set -o pipefail
          go test ./... -run 'Conformance|Canonical' -v | tee "$RUNNER_TEMP/go-conformance.txt"
          passed="$(grep -c '^--- PASS' "$RUNNER_TEMP/go-conformance.txt" || true)"
          echo "Go conformance tests passed: $passed"
          if [ "$passed" -eq 0 ]; then echo "::error::no Go conformance test matched"; exit 1; fi

      - name: Run the four legs
        env:
          GM_SDK_GO_DIR: ${{ github.workspace }}/sdks/sdk-go
          GM_SDK_TS_DIR: ${{ github.workspace }}/sdks/sdk-typescript
          GM_SDK_DOTNET_DIR: ${{ github.workspace }}/sdks/sdk-dotnet
          PYTHON: python
        run: interop/run_all.sh

      - name: Keep the scenario's artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interop-fixtures
          # na.json carries the throwaway operator key; never publish it.
          path: |
            interop/fixtures/
            !interop/fixtures/na.json
          if-no-files-found: ignore

  # The required check "Python, Go, TypeScript and C# agree": passes when the interoperability run passed, or when the
  # change detection said there was nothing to test and the interoperability run was skipped.
  # A failed or cancelled run fails it. With no detection output the job runs and must succeed.
  interop-result:
    name: Python, Go, TypeScript and C# agree
    needs: [changes, interop]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Passed, or nothing to test
        env:
          RESULT: ${{ needs.interop.result }}
          RUN: ${{ needs.changes.outputs.run }}
        run: |
          echo "Python, Go, TypeScript and C# agree: $RESULT (relevant changes: ${RUN:-unknown})"
          if [ "$RUN" = false ] && [ "$RESULT" = skipped ]; then exit 0; fi
          test "$RESULT" = success
