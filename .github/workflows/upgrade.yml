name: Upgrade

# A database written by each supported 0.x release, upgraded by this commit:
# every treaty, revocation, policy, decision and evidence record must still
# verify, before and after a backup restore and a migration to PostgreSQL.
# See DEPRECATION_POLICY.md (Persisted database state) and
# docs/operations/upgrade.md.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upgrade:
    name: Upgrade from ${{ matrix.from }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        from: ["0.59.1", "0.60.0", "0.61.1", "0.62.0", "0.63.0", "0.63.1", "0.64.0", "0.64.1", "0.65.0", "1.0.0", "1.0.1", "1.0.2", "1.1.0", "1.1.1", "1.2.0", "1.3.0"]
    services:
      postgres:
        # Docker Hub's official image, from Google's Docker Hub mirror (Docker Hub outages failed this job).
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_USER: genesis
          POSTGRES_PASSWORD: genesis
          POSTGRES_DB: gm_test
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genesis -d gm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository (with release tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[postgres]"

      - name: Rehearse the upgrade
        run: python scripts/upgrade_rehearsal.py --from "${{ matrix.from }}" --postgres-url postgresql://genesis:genesis@localhost:5432/gm_test
