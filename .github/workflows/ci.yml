name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests and smoke checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Verify release version
        run: python scripts/check_version.py

      - name: Verify release train (no component released ahead of VERSION)
        run: python scripts/check_release_train.py
        env:
          RELEASE_TRAIN_TOKEN: ${{ secrets.RELEASE_TRAIN_TOKEN }}

      - name: Run unit tests
        run: python -m pytest genesis_mesh/tests -q -W error::DeprecationWarning -m "not integration"

      - name: Run integration tests (capability demos)
        run: python -m pytest genesis_mesh/tests/integration -v -W error::DeprecationWarning -m integration

      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt -r requirements-dev.txt

      - name: Type check
        run: python -m mypy genesis_mesh --ignore-missing-imports

      - name: Compile package
        run: python -m compileall genesis_mesh -q

      - name: The built wheel runs a Network Authority
        run: |
          python -m pip wheel --no-deps -w dist .
          python scripts/upgrade_rehearsal.py --installed dist/genesis_mesh-*.whl

      - name: Build container image
        run: docker build -t genesis-mesh:ci .

      - name: Verify container fails closed without secrets
        run: |
          set +e
          output=$(docker run --rm genesis-mesh:ci 2>&1)
          status=$?
          echo "$output"
          test "$status" -ne 0
          echo "$output" | grep -q "Refusing to start"

      - name: CLI smoke workflow
        run: python -m genesis_mesh.cli dev up

  postgres:
    name: PostgreSQL backend and HA failover
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: genesis
          POSTGRES_PASSWORD: genesis
          POSTGRES_DB: gm_test
          # The NA needs code-point ordering (see docs/operations/high-availability.md).
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genesis -d gm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GENESIS_MESH_TEST_DATABASE_URL: postgresql://genesis:genesis@localhost:5432/gm_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies (with the PostgreSQL driver) and nginx
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e ".[postgres]"
          sudo apt-get update -q
          sudo apt-get install -y -q nginx
          sudo systemctl stop nginx || true

      - name: Run the full test suite on PostgreSQL
        run: python -m pytest genesis_mesh/tests -q -W error::DeprecationWarning -m "not integration"

      - name: Run integration tests on PostgreSQL, including the two-instance HA failover
        run: python -m pytest genesis_mesh/tests/integration -v -s -W error::DeprecationWarning -m integration
