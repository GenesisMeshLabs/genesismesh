name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests and smoke checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Verify release version
        run: python scripts/check_version.py

      - name: Verify release train (no component released ahead of VERSION)
        run: python scripts/check_release_train.py
        env:
          RELEASE_TRAIN_TOKEN: ${{ secrets.RELEASE_TRAIN_TOKEN }}

      - name: Run unit tests
        run: python -m pytest genesis_mesh/tests -q -W error::DeprecationWarning -m "not integration"

      - name: Run integration tests (capability demos)
        run: python -m pytest genesis_mesh/tests/integration -v -W error::DeprecationWarning -m integration

      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt -r requirements-dev.txt

      - name: Type check
        run: python -m mypy genesis_mesh --ignore-missing-imports

      - name: Compile package
        run: python -m compileall genesis_mesh -q

      - name: The built wheel runs a Network Authority
        run: |
          python -m pip wheel --no-deps -w dist .
          python scripts/upgrade_rehearsal.py --installed dist/genesis_mesh-*.whl

      - name: CLI smoke workflow
        run: python -m genesis_mesh.cli dev up

  container:
    name: Container images on ${{ matrix.arch }} (Network Authority and gateway)
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-latest}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A coordinated change is tested against the gateway branch of the same
      # name when it exists, and against main otherwise.
      - name: Choose the gateway revision
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          ref=main
          if git ls-remote --exit-code --heads https://github.com/GenesisMeshLabs/gateway.git "refs/heads/$BRANCH" > /dev/null; then ref="$BRANCH"; fi
          echo "Testing with gateway revision: $ref"
          echo "GATEWAY_REF=$ref" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GenesisMeshLabs/gateway
          ref: ${{ env.GATEWAY_REF }}
          path: gateway-src

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Each architecture builds and runs natively on its own runner.
      - name: Build the images
        run: |
          docker buildx build --load -t genesis-mesh:ci \
            --build-arg VERSION="$(tr -d '[:space:]' < VERSION)" --build-arg REVISION="$GITHUB_SHA" .
          GW_VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' gateway-src/Cargo.toml | head -n 1)"
          docker buildx build --load -t genesis-mesh-gateway:ci \
            --build-arg VERSION="$GW_VERSION" --build-arg REVISION="$(git -C gateway-src rev-parse HEAD)" gateway-src
          # The 1.0.x image ran as another uid; its volumes must be refused until handed over.
          git archive v1.0.1 | docker buildx build --load -t genesis-mesh:legacy -

      - name: Vulnerability gate
        run: |
          mkdir -p reports
          docker save genesis-mesh:ci -o reports/image.tar
          docker run --rm -v "$PWD/reports:/reports" aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --quiet --input /reports/image.tar --scanners vuln,secret --format json --output /reports/trivy.json
          rm reports/image.tar
          python scripts/image_vuln_gate.py reports/trivy.json

      - name: Container smoke tests
        run: |
          python scripts/container_smoke.py --image genesis-mesh:ci --gateway-image genesis-mesh-gateway:ci \
            --legacy-image genesis-mesh:legacy --context-dir . \
            --compose-file deploy/compose/docker-compose.images.yml

  postgres:
    name: PostgreSQL backend and HA failover
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: genesis
          POSTGRES_PASSWORD: genesis
          POSTGRES_DB: gm_test
          # The NA needs code-point ordering (see docs/operations/high-availability.md).
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genesis -d gm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GENESIS_MESH_TEST_DATABASE_URL: postgresql://genesis:genesis@localhost:5432/gm_test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies (with the PostgreSQL driver) and nginx
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e ".[postgres]"
          sudo apt-get update -q
          sudo apt-get install -y -q nginx
          sudo systemctl stop nginx || true

      - name: Run the full test suite on PostgreSQL
        run: python -m pytest genesis_mesh/tests -q -W error::DeprecationWarning -m "not integration"

      - name: Run integration tests on PostgreSQL, including the two-instance HA failover
        run: python -m pytest genesis_mesh/tests/integration -v -s -W error::DeprecationWarning -m integration
