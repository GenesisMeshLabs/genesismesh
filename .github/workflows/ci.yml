name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # The merge queue re-tests a pull request on top of main before it merges.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests and smoke checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      # pyflakes and import errors on the package, scripts and conformance
      # runner; ruff.toml holds the rules and the per-file baseline.
      - name: Lint (ruff)
        run: python -m ruff check genesis_mesh scripts conformance

      - name: Verify release version
        run: python scripts/check_version.py

      - name: Verify release train (no component released ahead of VERSION)
        run: python scripts/check_release_train.py
        env:
          RELEASE_TRAIN_TOKEN: ${{ secrets.RELEASE_TRAIN_TOKEN }}

      - name: Run unit tests (measuring coverage of trust, models and services)
        run: >-
          python -m pytest genesis_mesh/tests -q -W error::DeprecationWarning -m "not integration"
          --cov=genesis_mesh.trust --cov=genesis_mesh.models --cov=genesis_mesh.na_service.services
          --cov-report=json:coverage.json

      # A one-way ratchet: the floors in the script only rise.
      - name: Coverage floors
        run: python scripts/coverage_floor.py coverage.json

      - name: Run integration tests (capability demos)
        run: python -m pytest genesis_mesh/tests/integration -v -W error::DeprecationWarning -m integration

      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt -r requirements-dev.txt

      - name: Type check
        run: python -m mypy genesis_mesh --ignore-missing-imports

      - name: Compile package
        run: python -m compileall genesis_mesh -q

      - name: The built wheel runs a Network Authority
        run: |
          python -m pip wheel --no-deps -w dist .
          python scripts/upgrade_rehearsal.py --installed dist/genesis_mesh-*.whl

      - name: CLI smoke workflow
        run: python -m genesis_mesh.cli dev up

  # The image builds and the PostgreSQL suite are skipped when a pull request
  # touches none of their inputs (scripts/ci_changes.py); pushes to main and
  # manual runs always run them.
  changes-container:
    uses: ./.github/workflows/changes.yml
    with:
      group: container

  changes-postgres:
    uses: ./.github/workflows/changes.yml
    with:
      group: postgres

  container:
    name: Container images on ${{ matrix.arch }} (Network Authority and gateway)
    needs: changes-container
    if: ${{ !cancelled() && needs.changes-container.outputs.run != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-latest}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # 1.11.0: the gateway release pinned in contract/consumer-pins.json, as
      # its published image by digest; never a branch picked by name or main.
      # Its signature must come from the gateway's release workflow at that tag.
      - name: Read the pinned gateway release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/consumer_pins.py gateway | tee -a "$GITHUB_ENV"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify and pull the pinned gateway image
        run: |
          cosign verify "$GATEWAY_IMAGE" --certificate-identity "$GATEWAY_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          docker pull "$GATEWAY_IMAGE"

      # BuildKit and the Dockerfiles' base images (pinned by digest) come through
      # mirrors, falling back to Docker Hub: its outages failed every image job.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      # Each architecture builds and runs natively on its own runner.
      - name: Build the images
        run: |
          docker buildx build --load -t genesis-mesh:ci \
            --build-arg VERSION="$(tr -d '[:space:]' < VERSION)" --build-arg REVISION="$GITHUB_SHA" .
          # The 1.0.x image ran as another uid; its volumes must be refused until handed over.
          git archive v1.0.1 | docker buildx build --load -t genesis-mesh:legacy -

      - name: Vulnerability gate
        run: |
          mkdir -p reports
          docker save genesis-mesh:ci -o reports/image.tar
          docker run --rm -v "$PWD/reports:/reports" ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --quiet --input /reports/image.tar --scanners vuln,secret --format json --output /reports/trivy.json
          rm reports/image.tar
          python scripts/image_vuln_gate.py reports/trivy.json

      - name: Container smoke tests
        run: |
          python scripts/container_smoke.py --image genesis-mesh:ci --gateway-image "$GATEWAY_IMAGE" \
            --gateway-version "$GATEWAY_VERSION" --gateway-revision "$GATEWAY_REVISION" \
            --legacy-image genesis-mesh:legacy --context-dir . \
            --compose-file deploy/compose/docker-compose.images.yml

  # One stable required-check name over the architecture matrix.
  containers:
    name: Container images
    needs: [changes-container, container]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every architecture passed
        env:
          RESULT: ${{ needs.container.result }}
          RUN: ${{ needs.changes-container.outputs.run }}
        run: |
          echo "Container images: $RESULT (relevant changes: ${RUN:-unknown})"
          if [ "$RUN" = false ] && [ "$RESULT" = skipped ]; then exit 0; fi
          test "$RESULT" = success

  # v1.11.0: the contract bundle (contract/bundle.json, scripts/gm_contract.py).
  # The committed manifest and kind table must be current, every suite needs a
  # tier decision, and the release archive must build the same bytes twice.
  # The tool is vendored by every consumer, so it also runs on their oldest
  # Python (3.11) with the standard library alone.
  contract-bundle:
    name: Contract bundle
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11 (the tool's floor)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: The manifest is current and the archive builds (standard library only)
        run: |
          python --version
          python scripts/gm_contract.py manifest --check
          python scripts/gm_contract.py archive --out "$RUNNER_TEMP/contract"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: The kind table is current
        run: python scripts/render_contract_kinds.py --check

      - name: Bundle tests (spec rules, reproducible archive, consumer commands)
        run: python -m pytest genesis_mesh/tests/test_contract_bundle.py genesis_mesh/tests/test_contract_consumer.py -q

  postgres:
    name: PostgreSQL suite and HA failover tests
    needs: changes-postgres
    if: ${{ !cancelled() && needs.changes-postgres.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        # Docker Hub's official image, from Google's Docker Hub mirror (Docker Hub outages failed this job).
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_USER: genesis
          POSTGRES_PASSWORD: genesis
          POSTGRES_DB: gm_test
          # The NA needs code-point ordering (see docs/operations/high-availability.md).
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genesis -d gm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GENESIS_MESH_TEST_DATABASE_URL: postgresql://genesis:genesis@localhost:5432/gm_test
      # This job provides PostgreSQL and nginx: a test that needs them fails instead of skipping.
      GM_E2E_REQUIRED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies (with the PostgreSQL driver) and nginx
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e ".[postgres]"
          sudo apt-get update -q
          sudo apt-get install -y -q nginx
          sudo systemctl stop nginx || true

      - name: Run the full test suite on PostgreSQL
        run: python -m pytest genesis_mesh/tests -q -W error::DeprecationWarning -m "not integration"

      - name: Run integration tests on PostgreSQL, including the two-instance HA failover
        run: python -m pytest genesis_mesh/tests/integration -v -s -W error::DeprecationWarning -m integration

  # The required check "PostgreSQL backend and HA failover": passes when the suite passed, or when the
  # change detection said there was nothing to test and the suite was skipped.
  # A failed or cancelled run fails it. With no detection output the job runs and must succeed.
  postgres-result:
    name: PostgreSQL backend and HA failover
    needs: [changes-postgres, postgres]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Passed, or nothing to test
        env:
          RESULT: ${{ needs.postgres.result }}
          RUN: ${{ needs.changes-postgres.outputs.run }}
        run: |
          echo "PostgreSQL backend and HA failover: $RESULT (relevant changes: ${RUN:-unknown})"
          if [ "$RUN" = false ] && [ "$RESULT" = skipped ]; then exit 0; fi
          test "$RESULT" = success

  changelog:
    name: Changelog fragments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Pull requests add changelog.d/<version>/<name>.md; only a release PR
      # (branch release/<version>) folds them into CHANGELOG.md, so a feature PR for
      # the next version never conflicts with the release of this one.
      - name: Pull requests add fragments; only a release edits CHANGELOG.md
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: python3 scripts/changelog.py check ${BASE_REF:+--base origin/$BASE_REF} --branch "$HEAD_REF"
      # Pull requests add upgrade.d/<version>/<name>.md; only the release adds
      # the "Upgrading to <version>" section of docs/operations/upgrade.md.
      - name: Upgrade notes are fragments
        run: python3 scripts/upgrade_notes.py check
