name: Deploy Release to Azure VM

# The only Azure deployment workflow. It deploys the sanitized public reference
# instance (examples/public_dashboard) behind na.genesismesh.org by
# running infrastructure/scripts/deploy-public-dashboard.sh on the VM at an
# exact, reviewed commit. That script also keeps the retired legacy Network
# Authority stack (genesis-mesh-na, routers, canaries, trust-cycle timer)
# stopped and disabled. See docs/operations/public-reference-dashboard.md.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag (e.g. v0.58.1), branch or commit to deploy; must be on main"
        required: true
        default: "main"

concurrency:
  group: deploy-release-azure-vm
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy public reference instance
    runs-on: ubuntu-24.04
    environment:
      name: azure-production
      url: https://na.genesismesh.org/

    permissions:
      contents: read
      id-token: write

    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_VM_NAME: ${{ vars.AZURE_VM_NAME }}
      INPUT_REF: ${{ github.event.inputs.ref }}
      PUBLIC_URL: https://na.genesismesh.org

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve the reviewed build
        id: build
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF:-}" != "refs/heads/main" ]; then
            echo "Run this workflow from main, the allowed branch for azure-production." >&2
            exit 1
          fi
          for name in AZURE_CLIENT_ID AZURE_SUBSCRIPTION_ID AZURE_TENANT_ID AZURE_RESOURCE_GROUP AZURE_VM_NAME; do
            if [ -z "$(printf '%s' "${!name:-}" | tr -d '\r\n')" ]; then
              echo "$name is required" >&2
              exit 1
            fi
          done
          ref="${INPUT_REF:-main}"
          if ! [[ "$ref" =~ ^[A-Za-z0-9._/@:-]+$ ]]; then
            echo "Deployment ref contains unsupported characters: $ref" >&2
            exit 1
          fi
          git fetch --tags --force origin >/dev/null
          if git rev-parse --verify --quiet "refs/tags/$ref^{commit}" >/dev/null; then
            sha="$(git rev-parse "refs/tags/$ref^{commit}")"
          elif git rev-parse --verify --quiet "refs/remotes/origin/$ref^{commit}" >/dev/null; then
            sha="$(git rev-parse "refs/remotes/origin/$ref^{commit}")"
          elif git rev-parse --verify --quiet "$ref^{commit}" >/dev/null; then
            sha="$(git rev-parse "$ref^{commit}")"
          else
            echo "Unknown deployment ref: $ref" >&2
            exit 1
          fi
          # Only commits that reached main were reviewed.
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "Ref $ref ($sha) is not on main; refusing deployment" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying $ref ($sha)"

      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy on the VM
        shell: bash
        env:
          BUILD_SHA: ${{ steps.build.outputs.sha }}
        run: |
          set -euo pipefail
          resource_group="$(printf '%s' "$AZURE_RESOURCE_GROUP" | tr -d '\r\n')"
          vm_name="$(printf '%s' "$AZURE_VM_NAME" | tr -d '\r\n')"

          # Azure Run Command runs the generated file with /bin/sh as root. Ship
          # the deploy script from the reviewed commit itself and run it with bash.
          script="$(git show "$BUILD_SHA:infrastructure/scripts/deploy-public-dashboard.sh")"
          if printf '%s\n' "$script" | grep -qx 'GM_DEPLOY_SCRIPT_EOF'; then
            echo "Deploy script contains the heredoc delimiter" >&2
            exit 1
          fi
          {
            echo 'set -eu'
            echo "cat > /tmp/gm-deploy-public-dashboard.sh <<'GM_DEPLOY_SCRIPT_EOF'"
            printf '%s\n' "$script"
            echo 'GM_DEPLOY_SCRIPT_EOF'
            printf 'bash /tmp/gm-deploy-public-dashboard.sh %s\n' "$BUILD_SHA"
            echo 'rm -f /tmp/gm-deploy-public-dashboard.sh'
            echo 'for unit in genesis-mesh-na genesis-mesh-node genesis-mesh-node-d genesis-mesh-canary-001-na genesis-mesh-canary-anonymous-na genesis-mesh-trust-cycle-canary.timer; do'
            echo '  if systemctl is-active --quiet "$unit" || systemctl is-enabled --quiet "$unit"; then echo "Retired unit still active or enabled: $unit" >&2; exit 1; fi'
            echo 'done'
            echo 'echo __GENESIS_DEPLOY_SUCCESS__'
          } > /tmp/deploy-genesis-mesh.sh

          echo "Deploying $BUILD_SHA to Azure VM $vm_name in $resource_group"
          output="$(az vm run-command invoke \
            --resource-group "$resource_group" \
            --name "$vm_name" \
            --command-id RunShellScript \
            --scripts @/tmp/deploy-genesis-mesh.sh \
            --query "value[].message" \
            --output tsv)"
          printf '%s\n' "$output"
          if ! grep -q "__GENESIS_DEPLOY_SUCCESS__" <<<"$output"; then
            echo "Azure Run Command did not reach the deployment success marker" >&2
            exit 1
          fi

      - name: Probe the public instance
        shell: bash
        env:
          BUILD_SHA: ${{ steps.build.outputs.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS "$PUBLIC_URL/readyz" >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS "$PUBLIC_URL/readyz"
          echo
          # nginx caches for 15 s; wait for the new build to be served.
          build=""
          for attempt in $(seq 1 30); do
            build="$(curl -fsS "$PUBLIC_URL/dashboard.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["software"]["build"])')"
            if [ "$build" = "$BUILD_SHA" ]; then
              echo "Serving build $build"
              exit 0
            fi
            sleep 2
          done
          echo "Public instance serves build $build, expected $BUILD_SHA" >&2
          exit 1
