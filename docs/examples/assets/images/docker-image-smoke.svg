<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="490" viewBox="0 0 1060 490">
  <rect width="100%" height="100%" rx="18" fill="#0b1020"/>
  <circle cx="28" cy="28" r="7" fill="#ff5f57"/><circle cx="50" cy="28" r="7" fill="#ffbd2e"/><circle cx="72" cy="28" r="7" fill="#28c840"/>
  <text x="96" y="34" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">Genesis Mesh Docker image smoke</text>
  <style>.t{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px;fill:#d1e7ff;white-space:pre}</style>
<text x="24" y="58" class="t">$ docker image inspect genesis-mesh:demo --format 'User={{.Config.User}} ...'</text>
<text x="24" y="80" class="t">User=10001:10001 Entrypoint=["/usr/bin/tini","--","/usr/local/bin/start.sh"] ExposedPorts={"8443/tcp":{}}</text>
<text x="24" y="124" class="t">$ docker run --rm --entrypoint python genesis-mesh:demo -c "import genesis_mesh; ...; print('import-ok')"</text>
<text x="24" y="146" class="t">import-ok</text>
<text x="24" y="190" class="t">$ docker run --rm genesis-mesh:demo</text>
<text x="24" y="212" class="t">Starting Network Authority...</text>
<text x="24" y="234" class="t">ERROR: genesis block or NA key not mounted. Refusing to start.</text>
<text x="24" y="256" class="t">exit=1</text>
<text x="24" y="300" class="t">$ docker run --rm -e SERVICE_ROLE=bogus genesis-mesh:demo</text>
<text x="24" y="322" class="t">ERROR: unknown SERVICE_ROLE 'bogus'. Expected 'na' or 'node'.</text>
<text x="24" y="344" class="t">exit=1</text>
<text x="24" y="388" class="t">$ docker run --rm -e SERVICE_ROLE=node genesis-mesh:demo</text>
<text x="24" y="410" class="t">Starting Mesh Node...</text>
<text x="24" y="432" class="t">ERROR: genesis block not mounted. Refusing to start node.</text>
<text x="24" y="454" class="t">exit=1</text>
</svg>
