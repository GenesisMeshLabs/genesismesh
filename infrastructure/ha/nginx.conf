# Load balancer for the reference HA Network Authority (v0.60).
# Round robin over both instances; a failed instance is skipped (passive
# health) and a request that could not reach one is passed to the other.
# Requests already delivered to an instance are never replayed, so a
# non-idempotent request is not executed twice.

events { worker_connections 1024; }

http {
    upstream genesis_mesh_na {
        server na-a:8443 max_fails=1 fail_timeout=10s;
        server na-b:8443 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 8443;

        location / {
            proxy_pass http://genesis_mesh_na;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
