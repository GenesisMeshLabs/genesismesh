# Ruff: lint only (no formatting), CI step "Lint (ruff)" in "Tests and smoke checks".
#
# Rules: pyflakes (F), and pycodestyle's import (E4) and syntax (E9) errors.
# The per-file ignores below are the baseline of 2026-10-16 (335 findings in
# 96 files, mostly unused imports and pytest fixtures imported into test
# modules). A new file gets every rule. Fixing a file means removing its line
# here; never add one: fix the finding, or mark a deliberate re-export with
# "# noqa: F401" and the reason.

target-version = "py312"
extend-exclude = ["build", "docs", "examples", "ops"]

[lint]
select = ["E4", "E9", "F"]

[lint.per-file-ignores]
