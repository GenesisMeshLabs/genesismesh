# Reference high-availability Network Authority (v0.60).
#
# Two NA instances share one PostgreSQL database behind nginx. Neither
# instance keeps state of its own: stop either one and the other keeps
# serving decisions, revocations and evidence. See
# docs/operations/high-availability.md.
#
#   cp .env.example .env    # then fill in the values
#   mkdir -p secrets && grep -v '^#' <path to na.key> > secrets/na_seed
#   sudo chown 10001 secrets/na_seed && sudo chmod 0400 secrets/na_seed
#   docker compose up -d --build
#
# This is a single-host reference for testing the HA behaviour. In production
# the database is a managed, zone-redundant service (Azure Database for
# PostgreSQL Flexible Server) and the instances run on separate hosts.
#
# It builds the image from this checkout. To run a release instead, replace
# `build:` with `image: ghcr.io/genesismeshlabs/genesis-mesh@sha256:<digest>`
# after verifying it (docs/operations/container-images.md). The NA seed is a
# mounted secret file (NA_PRIVATE_KEY_SEED_FILE), not an environment value.

name: genesis-mesh-ha

x-na: &na
  build:
    context: ../../..
  environment:
    SERVICE_ROLE: na
    PORT: "8443"
    WEB_CONCURRENCY: "2"
    GENESIS_JSON: ${GENESIS_JSON:?set GENESIS_JSON (signed genesis block)}
    NA_KEY_PROVIDER: env
    NA_PRIVATE_KEY_SEED_FILE: /run/secrets/na_seed
    NA_KEY_ID: ${NA_KEY_ID:-na-ha}
    DATABASE_URL: postgresql://genesis:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/genesis_mesh
    NA_HA_MODE: "on"
    OPERATOR_PUBLIC_KEYS_JSON: ${OPERATOR_PUBLIC_KEYS_JSON:?set OPERATOR_PUBLIC_KEYS_JSON}
    OPERATOR_KEY_TIERS_JSON: ${OPERATOR_KEY_TIERS_JSON:?set OPERATOR_KEY_TIERS_JSON}
    EVIDENCE_STORE: "on"
    BOUNDARY_POLICY_ENFORCEMENT: required
  secrets:
    - na_seed
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8443/readyz', timeout=3).status == 200 else 1)"]
    interval: 5s
    timeout: 5s
    retries: 6
  restart: unless-stopped

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: genesis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: genesis_mesh
      # The NA needs code-point ordering (LC_COLLATE C).
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genesis -d genesis_mesh"]
      interval: 5s
      timeout: 5s
      retries: 10

  na-a: *na
  na-b: *na

  lb:
    image: nginx:1.27-alpine
    ports:
      - "8443:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      na-a:
        condition: service_healthy
      na-b:
        condition: service_healthy

secrets:
  na_seed:
    file: ./secrets/na_seed

volumes:
  pgdata:
